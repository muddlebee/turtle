name: Lint and Format

on:
  pull_request:
    branches:
      - "**"
    paths:
      - "**"

jobs:
  run-lint-format:
    name: Biome
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Node.js dependencies
        run: pnpm i --frozen-lockfile

      - name: Running lint and format check
        run: pnpm run format-and-lint

      - name: Validate Chopsticks configuration
        run: pnpm run chopsticks:validate

      - name: Test Chopsticks configuration tooling
        run: pnpm run test:chopsticks
