# Source: https://github.com/AcalaNetwork/chopsticks/blob/f6eab24db852e24c2c66e459600c3b9d68e2aa7b/configs/polkadot.yml
# Local Turtle RPC: ws://127.0.0.1:8000
host: 127.0.0.1
port: 8000
endpoint:
  - wss://polkadot-rpc.n.dwellir.com
  - wss://rpc.polkadot.io
mock-signature-host: true
block: ${env.POLKADOT_BLOCK_NUMBER}
db: .chopsticks/db/polkadot.sqlite
runtime-log-level: 5
# wasm-override: polkadot_runtime.compact.compressed.wasm

import-storage:
  System:
    Account:
      -
        -
          - 5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY
        - providers: 1
          data:
            free: '10000000000000000000'
  ParasDisputes:
    $removePrefix: ['disputes'] # those can makes block building super slow
